BANDS:
- min: 8
  max: 13
  theme: D
  artwork: fire-spirit
  name: The Fire Spirit
  tagline: All blaze, all heart — Horse and Snake energy.
  chip: Fire Spirit
  descDog:
  - '<div class="d-summary"><span class="label">THE ELEMENT</span><b>{name} burns bright: a Fire spirit with Horse-and-Snake energy.</b></div>'
  - <div class="d-body"><span class="lbl">What it looks like</span>Full-speed laps, loud opinions, a leash that never stays slack. {name} lives in the present tense and expects you to keep up.</div>
  - <div class="d-body"><span class="lbl">The real read</span>Fire is all warmth and momentum. The noise is enthusiasm, not defiance — channel it and {name} lights up the room.</div>
  descCat:
  - '<div class="d-summary"><span class="label">THE ELEMENT</span><b>{name} is a Fire spirit: Horse-and-Snake energy with a tail.</b></div>'
  - <div class="d-body"><span class="lbl">What it looks like</span>3am parkour, window-glass lunges and zero chill from the top of the perch. {name} turns the whole apartment into an arena.</div>
  - <div class="d-body"><span class="lbl">The real read</span>Fire is warmth and momentum in a small body. Give the blaze a daily outlet and the house gets calmer — not quieter, calmer.</div>
  traits:
  - blazing energy
  - main character
  - loud and loyal
  - never sits still
  tipDog: Fire needs a daily outlet. Add a long off-peak walk and a game of fetch with a “drop it” pause in the middle — that tiny stillness is the practice.
  tipCat: Fire needs a daily outlet. Two short, intense play sessions with a wand toy — ending with a snack — give the blaze somewhere to go.
- min: 14
  max: 18
  theme: A
  artwork: wood-spirit
  name: The Wood Spirit
  tagline: Always growing, always reaching — Tiger and Rabbit energy.
  chip: Wood Spirit
  descDog:
  - '<div class="d-summary"><span class="label">THE ELEMENT</span><b>{name} is a Wood spirit: curious, growing, always leaning toward the next thing.</b></div>'
  - <div class="d-body"><span class="lbl">What it looks like</span>Every bush on the walk is a bookshelf. {name} reads the neighbourhood nose-first and makes friends the same way.</div>
  - <div class="d-body"><span class="lbl">The real read</span>Wood stretches toward light. That curiosity is {name}’s love language — feed it with new routes and new smells.</div>
  descCat:
  - '<div class="d-summary"><span class="label">THE ELEMENT</span><b>{name} is a Wood spirit: curious, reaching, forever climbing.</b></div>'
  - <div class="d-body"><span class="lbl">What it looks like</span>Every perch is a branch and every sunny window a clearing. {name} patrols with purpose and checks in on you between rounds.</div>
  - <div class="d-body"><span class="lbl">The real read</span>Wood grows toward whatever is new. Rotate toys and add vertical routes and {name} will keep unfolding.</div>
  traits:
  - endlessly curious
  - explorer
  - friendly sprout
  - reaches for more
  tipDog: Wood loves a new path. Swap one regular walk a week for a route {name} has never sniffed and let the nose lead for the first five minutes.
  tipCat: Wood loves a new branch. Rotate toys weekly and add one new climbing spot or window view; watch {name} claim it by dinner.
- min: 19
  max: 23
  theme: C
  artwork: earth-spirit
  name: The Earth Spirit
  tagline: Steady, warm, unshakeable — Ox, Dragon, Goat and Dog energy.
  chip: Earth Spirit
  descDog:
  - '<div class="d-summary"><span class="label">THE ELEMENT</span><b>{name} is an Earth spirit: the steady centre of the household.</b></div>'
  - <div class="d-body"><span class="lbl">What it looks like</span>Same spot on the couch, same pace on the walk, same cheerful thump of the tail. {name} is the one thing that never changes in a changing week.</div>
  - <div class="d-body"><span class="lbl">The real read</span>Earth holds everything together. {name} is your anchor — keep their routine predictable and they will keep you grounded.</div>
  descCat:
  - '<div class="d-summary"><span class="label">THE ELEMENT</span><b>{name} is an Earth spirit: warm, reliable, immovable when it counts.</b></div>'
  - <div class="d-body"><span class="lbl">What it looks like</span>Dinner at the same time, a favorite blanket, a purr on schedule. {name} makes the whole home feel settled.</div>
  - <div class="d-body"><span class="lbl">The real read</span>Earth is stability. Keep the litter, bowl and bed in their usual places and {name} will hold the centre of the room for you.</div>
  traits:
  - steady anchor
  - creature of routine
  - warm heart
  - immovable when comfy
  tipDog: Earth thrives on rhythm. Keep meals and walks at fixed times, and add one slow “sniffari” walk a week as a treat.
  tipCat: Earth thrives on rhythm. Keep feeding, play and bedtime at fixed times and leave a warm, undisturbed spot for the afternoon nap.
