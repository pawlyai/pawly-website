# Legacy quiz (HowHuman) converted 1:1 from the shipped Toki_Quiz_HowHuman_InApp_EN_2026-10-08.html QUIZ object.
slug: HowHuman
id: how_human
titleShort: How Human Is Your Pet?
eraTitle: HUMAN-O-METER
h1: How human is <span class="accent">{name}</span>, really?
sub: 10 tiny tells about how {name} acts at home. I’ll put a number on how “human” {name} has become — and save a little to {name}’s profile.
trending: ✨ NOW TRENDING
startLabel: Measure the human in {name}
tipTemplate: The {n} thing{s} on file ({dims}) are already answered — these 10 are about {name}’s very human little quirks.
calcLines: [Reading the human tells…, Counting the side-eyes…, Measuring the sighs…, Calling the verdict…]
scoreBase: 0
scoreDisplay: 'Human-o-meter: <b>{score}</b> / {hi}'
meterEnds: {low: Pure pet, high: Basically a person}
dims: [Personality & temperament, Food preferences]
dimKeys: [temperament, eating]
DOG_QUESTIONS:
- tag: The Rant
  q: 'You’re loudly venting to a friend. {name}:'
  opts:
  - t: Dead asleep, couldn’t care less
    s: 1
    prof: {k: attunement, v: low}
  - t: Tilts their head, thinks you’re calling them
    s: 3
    prof: {k: attunement, v: mid}
  - t: Stares at you like *yeah, that’s genuinely unhinged, I get it*
    s: 5
    prof: {k: attunement, v: high}
- tag: The Sigh
  q: How often does {name} sigh?
  opts:
  - t: Never — just happy panting
    s: 1
    prof: {k: expressiveness, v: low}
  - t: Only a whine when dinner’s late
    s: 3
    prof: {k: expressiveness, v: mid}
  - t: Frequent, heavy, world-weary sighs
    s: 5
    prof: {k: expressiveness, v: high}
- tag: The Selfie
  q: 'You open the front camera. {name} leans in and:'
  opts:
  - t: Licks the lens — all slobber
    s: 1
    prof: {k: selfAware, v: low}
  - t: Stares blankly at themselves
    s: 3
    prof: {k: selfAware, v: mid}
  - t: Finds the angle, locks eyes, tucks their chin for a side profile
    s: 5
    prof: {k: selfAware, v: high}
- tag: You’re Emo
  q: 'You’re low on the sofa (work / breakup). {name}:'
  opts:
  - t: Brings a ball, zero read of the room
    s: 1
    prof: {k: empathy, v: low}
  - t: Sits quietly beside you
    s: 3
    prof: {k: empathy, v: mid}
  - t: Rests their head on your chest and sighs with you
    s: 5
    prof: {k: empathy, v: high}
- tag: The Posture
  q: '{name}’s usual sitting posture:'
  opts:
  - t: Proper four-paws or curled in a ball
    s: 1
    prof: {k: humanPosture, v: low}
  - t: Flopped on their side, limbs out
    s: 3
    prof: {k: humanPosture, v: mid}
  - t: Slouched into the sofa like a tired man, belly out
    s: 5
    prof: {k: humanPosture, v: high}
- tag: TV Night
  q: 'You’re watching TV. {name} has claimed:'
  opts:
  - t: The floor rug
    s: 1
    prof: {k: spaceClaim, v: low}
  - t: A corner of the sofa
    s: 3
    prof: {k: spaceClaim, v: mid}
  - t: Dead center, watching the screen intently
    s: 5
    prof: {k: spaceClaim, v: high}
- tag: Rain Check
  q: 'You promised a walk but cancelled (rain). {name}:'
  opts:
  - t: Forgets in seconds, goes to play
    s: 1
    prof: {k: grudge, v: low}
  - t: Guards the door and whines
    s: 3
    prof: {k: grudge, v: mid}
  - t: Shoots you a pointed stare — or chews your expensive slipper
    s: 5
    prof: {k: grudge, v: high}
- tag: Video Call
  q: 'On a video call, {name}’s participation:'
  opts:
  - t: None — the people on screen are irrelevant
    s: 1
    prof: {k: social, v: low}
  - t: Glances at the screen when they hear a voice
    s: 3
    prof: {k: social, v: mid}
  - t: Shoves their whole face into the lens to “join”
    s: 5
    prof: {k: social, v: high}
- tag: Privacy
  q: '{name}’s stance on your privacy:'
  opts:
  - t: As long as there’s food, they don’t care where you are
    s: 1
    prof: {k: velcro, v: low}
  - t: Likes to hang by your feet
    s: 3
    prof: {k: velcro, v: mid}
  - t: Must supervise you in the bathroom — no secrets allowed
    s: 5
    prof: {k: velcro, v: high}
- tag: The Veggie
  q: 'You drop a piece of vegetable. {name}:'
  opts:
  - t: Sniffs and leaves — meat only
    s: 1
    prof: {k: dietPreference, v: meat-only}
  - t: Gives it a tentative lick
    s: 3
    prof: {k: dietPreference, v: selective}
  - t: Chokes it down *to keep you company*
    s: 5
    prof: {k: dietPreference, v: omnivore}
