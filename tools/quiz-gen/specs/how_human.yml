  descDog: ['<div class="d-summary"><span class="label">THE VERDICT</span><b>{name}’s a gloriously simple soul: walk, snack, nap, you, repeat.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>No schemes, no side-eye, no grudges. {name} meets every walk like the first one and forgives everything in seconds.</div>', '<div class="d-body"><span class="lbl">The real read</span>The purest companionship there is — uncomplicated joy. {name} does cute; you do the thinking.</div>']
  descCat: ['<div class="d-summary"><span class="label">THE VERDICT</span><b>{name}’s a gloriously simple soul: sunbeam, snack, nap, repeat.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>No politics, no plotting. {name} lives fully in the moment — a toy, a warm spot, a lap, and all is right with the world.</div>', '<div class="d-body"><span class="lbl">The real read</span>The purest kind of cat: easy, present, unbothered. {name} does serene; you do the worrying.</div>']
  traits: [pure soul, lives in the moment, no baggage, easy joy]
