  descDog: ['<div class="d-summary"><span class="label">THE VERDICT</span><b>{name} has cracked which sad face gets the treat.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Strategic puppy eyes, a well-timed sigh, a paw on your knee at exactly the right moment. {name} is studying you.</div>', '<div class="d-body"><span class="lbl">The real read</span>A smart, socially-tuned dog mid-evolution. Stay consistent — clear rules keep the “negotiator phase” from running the house.</div>']
  descCat: ['<div class="d-summary"><span class="label">THE VERDICT</span><b>{name} has learned exactly which meow gets results.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Strategic 6am wake-ups, a stare held until you cave, affection dispensed only when it pays. {name} is training you.</div>', '<div class="d-body"><span class="lbl">The real read</span>A clever cat negotiating for more power. Keep boundaries firm — a bored, smart cat invents louder leverage.</div>']
