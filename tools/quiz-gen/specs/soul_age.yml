  descDog: ['<div class="d-summary"><span class="label">SOUL AGE</span><b>{name} is forever a puppy — all joy, zero worries.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Boundless energy, no chill, and genuinely no concept of “calm down.” Every single day is the best day.</div>', '<div class="d-body"><span class="lbl">The real read</span>Don’t wait for {name} to “grow up” — this IS the personality. Feed the energy, don’t fight it.</div>']
  descCat: ['<div class="d-summary"><span class="label">SOUL AGE</span><b>{name} is a forever-kitten — all play, zero worries.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Endless zoomies, pounces on nothing, 3am laps of the flat. {name} never got the memo about being a dignified cat.</div>', '<div class="d-body"><span class="lbl">The real read</span>This is simply who {name} is. Lean into play and enrichment instead of waiting for a maturity that isn’t coming.</div>']
  traits: [forever young, boundless energy, zero worries, pure chaos joy]
  tipDog: Lots of toys, lots of exercise, and go be feral with them. A tired {name} is a good {name}.
  tipCat: Rotate toys, add vertical space, and schedule real play burns. An under-stimulated baby invents 3am games.
