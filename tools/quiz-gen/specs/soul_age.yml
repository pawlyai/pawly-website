# Legacy quiz (SoulAge) converted 1:1 from the shipped Toki_Quiz_SoulAge_InApp_EN_2026-10-08.html QUIZ object.
slug: SoulAge
id: soul_age
titleShort: Your Pet’s Soul Age
eraTitle: SOUL AGE
h1: How old is <span class="accent">{name}</span>’s soul?
sub: Forget the birthday — 10 quick tells reveal the age {name} is *inside*. I’ll name it, and save a little to {name}’s profile.
trending: ✨ NOW TRENDING
startLabel: Reveal {name}’s soul age
tipTemplate: The {n} thing{s} on file ({dims}) are already answered — these 10 read {name}’s inner vibe, old soul or eternal baby.
calcLines: [Reading the inner years…, Counting the sighs and zoomies…, 'Old soul or baby? Checking…', Calling it…]
scoreBase: 3
scoreDisplay: 'Soul age: <b>{score}</b> years'
meterEnds: {low: Newborn soul, high: Ancient soul}
dims: [Energy & activity, Temperament]
dimKeys: [activity, temperament]
DOG_QUESTIONS:
- tag: Sleep
  q: 'At night, {name}:'
  opts:
  - t: Snoring on schedule by 9pm, immovable
    s: 10
    prof: {k: activityRhythm, v: early-settler}
  - t: 3am parkour, suddenly wide awake
    s: -5
    prof: {k: activityRhythm, v: night-owl}
- tag: New Toy
  q: 'A pricey new toy:'
  opts:
  - t: Two sniffs and walks off — *that’s it?*
    s: 8
    prof: {k: playDrive, v: low}
  - t: Loses their mind like it’s the first toy ever
    s: -5
    prof: {k: playDrive, v: high}
- tag: The Call
  q: 'You call {name}’s name across the park:'
  opts:
  - t: Slow turn, 3 seconds of deliberation
    s: 10
    prof: {k: biddability, v: aloof}
  - t: Springs over instantly like a loaded spring
    s: -3
    prof: {k: biddability, v: eager}
- tag: The Eyes
  q: '{name}’s usual gaze:'
  opts:
  - t: Deep and world-weary, like they’ve seen all of dog-life
    s: 12
    prof: {k: demeanor, v: world-weary}
  - t: Clear and gloriously empty — just food and the ball
    s: 0
    prof: {k: demeanor, v: bright-simple}
- tag: New Thing
  q: 'A new object appears (a delivery box):'
  opts:
  - t: One sniff, confirms it’s safe, walks away
    s: 5
    prof: {k: curiosity, v: low}
  - t: Must climb in, shred it, claim it as territory
    s: -5
    prof: {k: curiosity, v: high}
- tag: Provocation
  q: 'Another dog barks outside. {name}:'
  opts:
  - t: Rolls their eyes, can’t be bothered
    s: 15
    prof: {k: reactivity, v: low}
  - t: Must bark back through the window for half an hour
    s: -8
    prof: {k: reactivity, v: high}
- tag: The Sigh
  q: 'About sighing:'
  opts:
  - t: Frequent, world-weary sighs
    s: 10
    prof: {k: expressiveness, v: weary}
  - t: Never sighs — just excited panting
    s: -2
    prof: {k: expressiveness, v: upbeat}
- tag: On a Walk
  q: '{name}’s walking mindset:'
  opts:
  - t: Stop-and-go, prefers watching the flowers and the distance
    s: 8
    prof: {k: activityLevel, v: low}
  - t: Bulldozes forward, always hunting a new route
    s: -10
    prof: {k: activityLevel, v: high}
- tag: Surprise
  q: 'You drop a glass with a crash. {name}:'
  opts:
  - t: Unshakeable, doesn’t even lift an eyelid
    s: 10
    prof: {k: boldness, v: bold}
  - t: Bolts around the room / dives under the sofa
    s: -5
    prof: {k: boldness, v: skittish}
- tag: You Cry
  q: 'You’re crying. {name}:'
  opts:
  - t: Quietly comes to lean on you, eyes full of understanding
    s: 15
    prof: {k: empathy, v: high}
  - t: Thinks it’s a new game, bites your hair
    s: -10
    prof: {k: empathy, v: oblivious}
