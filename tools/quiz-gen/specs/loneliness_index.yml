# Legacy quiz (LonelinessIndex) converted 1:1 from the shipped Toki_Quiz_LonelinessIndex_InApp_EN_2026-10-08.html QUIZ object.
slug: LonelinessIndex
id: loneliness_index
titleShort: Your Pet’s Loneliness Index
eraTitle: LONELINESS CHECK
h1: How lonely is <span class="accent">{name}</span> when you’re away?
sub: 10 honest questions about {name} when you leave and when you’re home. I’ll read the loneliness signals — and save what matters to {name}’s profile.
trending: ✨ NOW TRENDING
startLabel: Check {name}’s loneliness
tipTemplate: The {n} thing{s} on file ({dims}) are already answered — these 10 pick up {name}’s real separation signals, gently.
calcLines: [Reading the alone-time signals…, Checking appetite & sleep…, 'How attached, how anxious?', Scoring it…]
scoreBase: 0
scoreDisplay: 'Loneliness score: <b>{score}</b> / {hi}'
meterEnds: {low: Secure & content, high: Lonely / anxious}
dims: [Separation & emotional needs, Appetite & toilet habits]
dimKeys: [separation, appetite, elimination]
DOG_QUESTIONS:
- tag: You Leave
  q: 'You grab keys and coat to go out. {name}:'
  opts:
  - t: Glances up and keeps sleeping
    s: 1
    prof: {k: departureReaction, v: calm}
  - t: Comes over for a nudge and a treat
    s: 2
    prof: {k: departureReaction, v: mild}
  - t: Gets mournful, even blocks the door
    s: 3
    prof: {k: departureReaction, v: distressed}
  - t: Frantically brings toys / spins in anxious circles
    s: 4
    prof: {k: departureReaction, v: panic}
- tag: You’re Home
  q: 'The moment you open the door:'
  opts:
  - t: A slow yawn, wakes up unhurried
    s: 1
    prof: {k: reunionIntensity, v: low}
  - t: Normal wag and greeting, about a minute
    s: 2
    prof: {k: reunionIntensity, v: normal}
  - t: Springs up like a spring, screams / leaps on you
    s: 3
    prof: {k: reunionIntensity, v: intense}
  - t: Wrecked the house, or hysterical nonstop barking
    s: 4
    prof: {k: reunionIntensity, v: over-the-top}
- tag: Home All Day
  q: 'On a weekend when you’re home all day, {name}:'
  opts:
  - t: Plays alone, checks in occasionally
    s: 1
    prof: {k: proximityNeed, v: low}
  - t: Stays in the same room at a safe distance
    s: 2
    prof: {k: proximityNeed, v: moderate}
  - t: Needs body contact (leaning, on your lap)
    s: 3
    prof: {k: proximityNeed, v: high}
  - t: Springs up like a shadow the instant you stand
    s: 4
    prof: {k: proximityNeed, v: velcro}
- tag: Sleep
  q: '{name}’s sleep pattern:'
  opts:
  - t: Regular sleep, bright and rested when you’re home
    s: 1
    prof: {k: sleepSecurity, v: secure}
  - t: Sometimes over-sleeps by day, wants you at night
    s: 2
    prof: {k: sleepSecurity, v: mild}
  - t: Sleeps almost all day, seems listless
    s: 3
    prof: {k: sleepSecurity, v: low}
  - t: Only dares deep-sleep when you’re in; startles at any sound
    s: 4
    prof: {k: sleepSecurity, v: hypervigilant}
- tag: Chewing
  q: 'About “destruction” behavior:'
  opts:
  - t: Never — a model student
    s: 1
    prof: {k: destructiveness, v: none}
  - t: Occasionally shreds a tissue, just for fun
    s: 2
    prof: {k: destructiveness, v: mild}
  - t: Targets things with your scent (shoes, pillows)
    s: 3
    prof: {k: destructiveness, v: scent-targeted}
  - t: Chronically damaged door frames / curtains / furniture
    s: 4
    prof: {k: destructiveness, v: severe}
- tag: Ignored
  q: 'When you’re on your phone and ignore {name}:'
  opts:
  - t: Wanders off to their own toy
    s: 1
    prof: {k: attentionSeeking, v: low}
  - t: Sighs and lies down nearby
    s: 2
    prof: {k: attentionSeeking, v: mild}
  - t: Nudges your hand, drops a ball on your phone
    s: 3
    prof: {k: attentionSeeking, v: active}
  - t: Deliberately chews or pees to force attention
    s: 4
    prof: {k: housesoiling, v: attention-seeking}
- tag: Appetite
  q: '{name}’s appetite:'
  opts:
  - t: Never misses a meal, eats whatever you give
    s: 1
    prof: {k: appetite, v: robust}
  - t: Eats when you’re out, but slowly
    s: 2
    prof: {k: appetite, v: slower-alone}
  - t: Won’t eat unless you’re home
    s: 3
    prof: {k: appetite, v: owner-dependent}
  - t: Shows pica — eats dirt, licks fur bald
    s: 4
    prof: {k: pica, v: present}
- tag: Your Calls
  q: 'When you’re on a phone / video call:'
  opts:
  - t: No reaction at all
    s: 1
    prof: {k: callJealousy, v: none}
  - t: Tilts their head to listen
    s: 2
    prof: {k: callJealousy, v: mild}
  - t: Vocalizes at the phone to join in
    s: 3
    prof: {k: callJealousy, v: active}
  - t: Visibly dejected, even hides
    s: 4
    prof: {k: callJealousy, v: distressed}
- tag: The Outdoors
  q: 'Out at the park, {name}:'
  opts:
  - t: Curious, eagerly explores new things
    s: 1
    prof: {k: exploration, v: confident}
  - t: Plays a while, then wants to go home
    s: 2
    prof: {k: exploration, v: moderate}
  - t: Timid, constantly checks you’re in sight
    s: 3
    prof: {k: exploration, v: you-anchored}
  - t: Lost interest in the world, only wants to cling to you
    s: 4
    prof: {k: exploration, v: shut-down}
- tag: Shower Door
  q: 'When you shower behind a closed door, {name}:'
  opts:
  - t: Waits outside, or doesn’t care
    s: 1
    prof: {k: barrierTolerance, v: high}
  - t: Scratches the door now and then to check
    s: 2
    prof: {k: barrierTolerance, v: mild}
  - t: Cries nonstop, as if you’re drowning in there
    s: 3
    prof: {k: barrierTolerance, v: low}
  - t: Extreme distress — even loses bladder control at the door
    s: 4
    prof: {k: housesoiling, v: stress-elimination}
