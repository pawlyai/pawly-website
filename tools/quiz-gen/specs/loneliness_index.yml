BANDS:
- min: 10
  max: 16
  theme: A
  artwork: secure-content
  name: Secure & Content
  tagline: '{name} is comfortable in their own company.'
  chip: Secure
  descDog: ['<div class="d-summary"><span class="label">THE READ</span><b>{name} handles alone-time well — a confident, securely-attached dog.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Calm goodbyes, relaxed reunions, eats happily whether you’re there or not, and self-settles.</div>', <div class="d-body"><span class="lbl">The real read</span>Exactly where you want to be. Keep the routine steady and leave a solo chew or two for alone-time.</div>]
  descCat: ['<div class="d-summary"><span class="label">THE READ</span><b>{name} is comfortable in their own company — a secure cat.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Unbothered by your comings and goings, relaxed, eats and sleeps normally when alone.</div>', <div class="d-body"><span class="lbl">The real read</span>Ideal. Keep a window perch and a puzzle toy for solo time and the routine predictable.</div>]
  traits: [secure, self-settling, resilient, easy-going]
  tipDog: Keep the good routine, rotate a couple of solo toys, and keep goodbyes and hellos low-key so alone-time stays no big deal.
  tipCat: Keep the good routine, offer a window perch and a puzzle toy for solo time, and keep comings and goings calm.
- min: 17
  max: 25
  theme: B
  artwork: mildly-attached
  name: Mildly Attached
  tagline: A little clingy — {name} would love more of you.
  chip: Mildly Attached
  descDog: ['<div class="d-summary"><span class="label">THE READ</span><b>{name} leans on you a little — small signs of missing you.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Eager reunions, a bit of shadowing, eats a touch slower alone. Nothing alarming — just a dog who’d prefer you around.</div>', '<div class="d-body"><span class="lbl">The real read</span>Easy to nudge back to secure. A stuffed chew as you leave, a worn-scent item, and keep goodbyes low-key.</div>']
  descCat: ['<div class="d-summary"><span class="label">THE READ</span><b>{name} is a little clingy — would love more of you.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Greets you hard, follows you about, slightly off food when you travel. Sweet, not worrying.</div>', '<div class="d-body"><span class="lbl">The real read</span>Predictable feeding and play times plus a puzzle feeder give {name} a reassuring sense of control.</div>']
  traits: [affectionate, slightly clingy, people-focused, sweet]
  tipDog: Give {name} a puzzle feeder or stuffed chew right as you leave, plus a worn-scent item. Keep goodbyes boring — big emotional exits teach anxiety.
  tipCat: Leave a puzzle feeder and a cozy perch, and keep a worn-scent item out. Predictable feeding and play times give {name} a sense of control.
- min: 26
  max: 33
  theme: C
  artwork: feeling-lonely
  name: Elevated — Feeling Lonely
  tagline: '{name} is showing real separation stress.'
  chip: Elevated
  descDog: ['<div class="d-summary"><span class="label">THE READ</span><b>{name} is finding alone-time genuinely hard.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Distress at departures, over-the-top reunions, scent-targeted chewing, an appetite that dips without you.</div>', '<div class="d-body"><span class="lbl">The real read</span>Addressable — rebuild confidence with short, gradual departures that end before panic, plus enrichment while you’re out. If it isn’t improving in a few weeks, loop in your vet.</div>']
  descCat: ['<div class="d-summary"><span class="label">THE READ</span><b>{name} is showing real separation stress.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Mournful exits, over-grooming or hiding, off food alone, maybe litter-box changes.</div>', '<div class="d-body"><span class="lbl">The real read</span>Build security with fixed routines, more vertical space and hiding spots, and Feliway. Any litter-box or appetite change deserves a vet check — stress shows up fast in a cat.</div>']
  traits: [anxious when alone, over-attached, stress signals, needs support]
  tipDog: 'Start structured alone-time training: short, gradual departures that end *before* panic. Add enrichment for while you’re out, and a pet cam to spot patterns. If it’s not improving in a few weeks, loop in your vet.'
  tipCat: Build security with fixed routines, more vertical space and hiding spots, a Feliway diffuser, and interactive play before you leave. Any litter-box or appetite change deserves a vet check — stress shows up in a cat’s body fast.
- min: 34
  max: 40
  theme: D
  artwork: needs-support
  name: High — Likely Separation Anxiety
  tagline: '{name} needs real support — and maybe a pro.'
  chip: High
  descDog: ['<div class="d-summary"><span class="label">THE READ</span><b>{name}’s signals point to significant separation anxiety.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Panic at departures, destruction, house-soiling, refusing food alone, maybe pica. This is distress, not misbehaviour.</div>', '<div class="d-body"><span class="lbl">The real read</span>Please loop in your vet or a veterinary behaviourist. Desensitisation plus enrichment is the core; a vet-prescribed medication can make the training work. <b>Pica, house-soiling or not eating are red flags to raise promptly.</b></div>']
  descCat: ['<div class="d-summary"><span class="label">THE READ</span><b>{name}’s signals point to significant separation distress.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Panic, over-grooming, house-soiling, pica, or refusing food when alone. {name} can’t help it.</div>', '<div class="d-body"><span class="lbl">The real read</span>Please see your vet or a veterinary behaviourist, and rule out medical causes first (stress cystitis/FIC can mimic this). Routine, enrichment, Feliway and — if advised — medication help. <b>Pica or house-soiling needs a prompt visit.</b></div>']
  traits: [separation anxiety, high distress, needs a plan, not misbehaving]
  tipDog: Please loop in your vet or a veterinary behaviorist. A desensitization program (gradually longer, sub-threshold departures) plus environmental enrichment is the core; a vet-prescribed medication (e.g. an SSRI) can make the training work. <b>Pica, house-soiling, or not eating are red flags to raise with your vet promptly.</b>
  tipCat: Please see your vet or a veterinary behaviorist. Rule out medical causes first — stress cystitis (FIC) and litter-box changes can mimic or accompany this. A plan of routine, enrichment, Feliway and (if advised) medication helps. <b>Pica, house-soiling, over-grooming, or not eating need a prompt vet visit.</b>
disclaimer: '<b>A gentle screener, not a diagnosis</b>: a playful read of {name}’s alone-time signals from 10 everyday habits.<br>If you’re worried — especially about not eating, house-soiling, or self-harm — please talk to your vet. Not a substitute for professional advice.'
