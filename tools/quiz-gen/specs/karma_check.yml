  tagline: An equal soul — here to reflect you back to yourself.
  chip: Mirror
  descDog: ['<div class="d-summary"><span class="label">THE KARMA</span><b>You and {name} are equals — a soul contract of mutual growth.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>{name} mirrors your state: anxious you, frantic them; calm you, gentle them.</div>', '<div class="d-body"><span class="lbl">The real read</span>An emotionally attuned dog. Tend your own calm — walk on grass, slow down — and watch theirs follow.</div>']
  descCat: ['<div class="d-summary"><span class="label">THE KARMA</span><b>You and {name} are on equal footing — a mirror for your inner weather.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>{name} reflects your mood with uncanny accuracy; a tense house makes a tense cat.</div>', '<div class="d-body"><span class="lbl">The real read</span>Keep your home calm and your routine steady — {name} reads your nervous system.</div>']
  traits: [emotional mirror, attuned, equal soul, co-regulator]
  tipDog: Try “grounding” together — walk {name} on grass, breathe, slow down. When you regulate your own stress, you regulate theirs.
  tipCat: Keep your home calm and your routine steady — {name} reads your nervous system. A peaceful you is the best enrichment for a mirror cat.
