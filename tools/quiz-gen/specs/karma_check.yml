  chip: Little Demon
  descDog: ['<div class="d-summary"><span class="label">THE KARMA</span><b>In a past life {name} owed you — and came back to collect, loudly.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>{name} brings the chaos; you provide the patience. Every zoomie is a small test of your calm.</div>', '<div class="d-body"><span class="lbl">The real read</span>A high-spirited, low-zen soul. The mischief is really a bid for your energy — it’s love, just the feral kind.</div>']
  descCat: ['<div class="d-summary"><span class="label">THE KARMA</span><b>A past-life debtor, back to collect with 3am parkour.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>{name} knocks, pounces and patrols; your job is to breathe and not take the bait.</div>', <div class="d-body"><span class="lbl">The real read</span>Pure feral affection. More play and vertical space turn the “debt collection” into healthy burn.</div>]
  traits: [chaos spirit, patience-tester, feral love, pure mischief]
