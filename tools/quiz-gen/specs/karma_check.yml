slug: KarmaCheck
id: karma_check
titleShort: Blessing or Lesson?
eraTitle: KARMA CHECK
h1: Is <span class="accent">{name}</span> a blessing or a lesson?
sub: 5 questions, a little Eastern mysticism. I’ll reveal why {name} came into your life — and save a little to {name}’s profile.
trending: ✨ NOW TRENDING
startLabel: Reveal {name}’s karma
tipTemplate: 'The {n} thing{s} on file ({dims}) are already answered — these 5 read {name}’s soul: debtor, mirror, or guardian.'
calcLines: [Consulting the stars…, Reading the old-soul energy…, 'Debt, mirror, or blessing?', Revealing the karma…]
scoreBase: 0
meterEnds: {low: Here to test you, high: Here to bless you}
dims: [Temperament & bond, Adaptability]
dimKeys: [temperament, adaptability]
DOG_QUESTIONS:
- tag: Protective Energy
  q: 'You wake from a nightmare at night. {name}:'
  opts:
  - t: Sleeping harder than you, even snoring
    s: 1
    prof: {k: protectiveness, v: low}
  - t: Comes to sniff you, confirms you’re alive, goes back to sleep
    s: 3
    prof: {k: protectiveness, v: mid}
  - t: As if they sensed it — already at your side, comforting you
    s: 5
    prof: {k: protectiveness, v: high}
- tag: Reciprocity
  q: 'You buy {name} a pricey treat or toy. They:'
  opts:
  - t: Snatch it and bolt — no thanks whatsoever
    s: 1
    prof: {k: reciprocity, v: low}
  - t: Love it, forget it by tomorrow
    s: 3
    prof: {k: reciprocity, v: mid}
  - t: Deeply content — even bring you their old favorite to “trade”
    s: 5
    prof: {k: reciprocity, v: high}
- tag: Zen Level
  q: 'Facing new furniture or a change at home, {name}:'
  opts:
  - t: Destroys it in protest
    s: 1
    prof: {k: adaptability, v: reactive}
  - t: Hides and observes, needs time to adjust
    s: 3
    prof: {k: adaptability, v: cautious}
  - t: Utterly zen, watching you fuss like an old monk
    s: 5
    prof: {k: adaptability, v: unflappable}
- tag: Soul Sync
  q: 'You sigh at the air from work stress. {name}:'
  opts:
  - t: Thinks you’re calling, runs over for food
    s: 1
    prof: {k: emotionalSync, v: low}
  - t: Tilts their head, pure clueless innocence
    s: 3
    prof: {k: emotionalSync, v: mid}
  - t: Looks deep into you and sighs back, as if sharing the load
    s: 5
    prof: {k: emotionalSync, v: high}
- tag: Past-Life Memory
  q: 'Watching the park from the window, {name}’s gaze is:'
  opts:
  - t: Locked on a bird, ready to go fight it
    s: 1
    prof: {k: preyDrive, v: high}
  - t: Just people-watching the street
    s: 3
    prof: {k: preyDrive, v: mid}
  - t: Ethereal, as if pondering the universe’s ultimate truth
    s: 5
    prof: {k: preyDrive, v: serene}
