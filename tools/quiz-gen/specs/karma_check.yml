  chip: Blessing
  descDog: [<div class="d-summary"><span class="label">THE KARMA</span><b>The legendary “repayment” dog — here to watch over you.</b></div>, '<div class="d-body"><span class="lbl">What it looks like</span>Steady, intuitive, somehow always there on your worst days. {name}’s presence quietly lowers your stress.</div>', '<div class="d-body"><span class="lbl">The real read</span>A deeply bonded, generous soul. Give {name} a sunny spot to recharge and return the devotion with steady, quiet time.</div>']
  descCat: [<div class="d-summary"><span class="label">THE KARMA</span><b>The rare “repayment” cat — a quiet guardian with a healing aura.</b></div>, '<div class="d-body"><span class="lbl">What it looks like</span>Calm, intuitive, present in your hardest moments; just having {name} near settles you.</div>', '<div class="d-body"><span class="lbl">The real read</span>A serene, generous soul. Give {name} a sunny “Zen Zone” and make sure this gentle one feels cherished back.</div>']
  traits: [old soul, healing aura, intuitive guardian, serene devotion]
