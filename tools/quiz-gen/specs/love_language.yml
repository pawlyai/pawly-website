slug: LoveLanguage
id: love_language
titleShort: Your Pet’s Love Language
eraTitle: LOVE LANGUAGE
h1: What’s <span class="accent">{name}</span>’s love language?
sub: 12 everyday moments reveal how {name} really bonds with you. I’ll name their love language — and save it to {name}’s profile.
trending: ✨ NOW TRENDING
startLabel: Find {name}’s love language
tipTemplate: The {n} thing{s} on file ({dims}) are already answered — these 12 read how {name} loves and attaches.
calcLines: [Reading the bond…, Measuring the attachment…, 'Secure, aloof, velcro or chaos?', Naming the love language…]
scoreBase: 0
meterEnds: {low: Calm & secure, high: High-energy chaos}
dims: [Attachment & bonding, Energy level]
dimKeys: [attachment, energy]
DOG_QUESTIONS:
- tag: Work Mode
  q: 'You switch on Do-Not-Disturb to work. {name} is:'
  opts:
  - t: Tucked under the desk as your footrest
    s: 1
    prof: {k: proximitySeeking, v: calm-close}
  - t: In another room, gorgeous and uninterested
    s: 2
    prof: {k: proximitySeeking, v: independent}
  - t: On your lap trying to co-author every email
    s: 3
    prof: {k: proximitySeeking, v: demanding}
  - t: Zooming around trying to demolish the wall
    s: 4
    prof: {k: proximitySeeking, v: restless}
- tag: Quick Errand
  q: 'You step out for a 5-minute package pickup. {name}:'
  opts:
  - t: Waits calmly by the door
    s: 1
    prof: {k: separationReaction, v: calm}
  - t: Didn’t even notice, rolled over
    s: 2
    prof: {k: separationReaction, v: unbothered}
  - t: Shrieks like you’ve left for a mission abroad
    s: 3
    prof: {k: separationReaction, v: distress}
  - t: Seizes the chance to knock your drink off the desk
    s: 4
    prof: {k: separationReaction, v: acts-out}
- tag: The Guest
  q: 'A stranger-friend visits. {name}:'
  opts:
  - t: Polite sniff, confirms, sits calmly
    s: 1
    prof: {k: strangerSociability, v: polite}
  - t: Vanishes — the guest doubts you own a pet
    s: 2
    prof: {k: strangerSociability, v: avoidant}
  - t: Rubs all over the newcomer, defecting on the spot
    s: 3
    prof: {k: strangerSociability, v: over-friendly}
  - t: Treats the guest’s shoelaces as a chew toy
    s: 4
    prof: {k: strangerSociability, v: nippy}
- tag: Eye Contact
  q: 'You lock eyes lovingly. {name}:'
  opts:
  - t: Slow-blinks back, pink bubbles in the air
    s: 1
    prof: {k: affectionStyle, v: serene}
  - t: Turns away, refuses eye contact
    s: 2
    prof: {k: affectionStyle, v: reserved}
  - t: Rushes over to kiss your face
    s: 3
    prof: {k: affectionStyle, v: smothering}
  - t: Reads it as a challenge, ready to wrestle
    s: 4
    prof: {k: affectionStyle, v: rowdy}
- tag: Bedtime
  q: 'At night, {name}’s coordinates:'
  opts:
  - t: Foot of the bed, standing guard
    s: 1
    prof: {k: sleepProximity, v: guardian}
  - t: Their own den — independent icon
    s: 2
    prof: {k: sleepProximity, v: own-den}
  - t: Pressed to your neck / under the covers
    s: 3
    prof: {k: sleepProximity, v: glued}
  - t: Sprawled across your head, shoving you off
    s: 4
    prof: {k: sleepProximity, v: bed-hog}
- tag: You Cry
  q: 'You cry. {name}’s first reaction:'
  opts:
  - t: Quietly brings their favorite toy
    s: 1
    prof: {k: comfortResponse, v: gift-giver}
  - t: Watches from afar — *humans are fragile*
    s: 2
    prof: {k: comfortResponse, v: detached}
  - t: Frantically licks your tears to “fix” you
    s: 3
    prof: {k: comfortResponse, v: frantic}
  - t: Does a zoomie to cheer you up (or just chaos)
    s: 4
    prof: {k: comfortResponse, v: clown}
- tag: Road Trip
  q: 'On a car trip, {name}:'
  opts:
  - t: Watches the window like an arthouse film
    s: 1
    prof: {k: noveltyCoping, v: calm}
  - t: Asleep on boarding, wake me at arrival
    s: 2
    prof: {k: noveltyCoping, v: chill}
  - t: Must grip your arm the whole way
    s: 3
    prof: {k: noveltyCoping, v: needs-contact}
  - t: Tries to jump into the driver’s seat
    s: 4
    prof: {k: noveltyCoping, v: wild}
- tag: Kitchen
  q: 'You’re busy in the kitchen. {name}:'
  opts:
  - t: Safe distance, waiting for a “dropped snack”
    s: 1
    prof: {k: foodProximity, v: patient}
  - t: Waiting in the living room — *dinner will call me*
    s: 2
    prof: {k: foodProximity, v: aloof}
  - t: Wrapped around your ankles like a charm
    s: 3
    prof: {k: foodProximity, v: underfoot}
  - t: Tries to jump up to “help cook”
    s: 4
    prof: {k: foodProximity, v: counter-surfer}
- tag: Recall
  q: 'You call {name}’s name from across the park:'
  opts:
  - t: Sprints over, brakes failing
    s: 1
    prof: {k: recall, v: instant}
  - t: Ear twitches, body immovable
    s: 2
    prof: {k: recall, v: selective}
  - t: Already behind you before you finished
    s: 3
    prof: {k: recall, v: ever-present}
  - t: Runs the opposite way, sure it’s bath time
    s: 4
    prof: {k: recall, v: bolter}
- tag: New Toy
  q: 'A brand-new toy:'
  opts:
  - t: Plays gently, puts it away with care
    s: 1
    prof: {k: playStyle, v: gentle}
  - t: One sniff — *that’s it?*
    s: 2
    prof: {k: playStyle, v: unimpressed}
  - t: Inseparable 24/7, new obsession
    s: 3
    prof: {k: playStyle, v: obsessive}
  - t: Disassembled and destroyed in 10 minutes
    s: 4
    prof: {k: playStyle, v: destroyer}
- tag: New Date
  q: 'You bring home a new date. {name}:'
  opts:
  - t: Reads your vibe — you like them, they like them
    s: 1
    prof: {k: jealousy, v: attuned}
  - t: Ignores them, the person is irrelevant
    s: 2
    prof: {k: jealousy, v: indifferent}
  - t: Jealous — wedges between you two
    s: 3
    prof: {k: jealousy, v: jealous}
  - t: Steals their sock as a warning
    s: 4
    prof: {k: jealousy, v: territorial}
- tag: Rainy Day
  q: 'Rainy day, stuck inside. {name}:'
  opts:
  - t: Quietly curls up for a movie
    s: 1
    prof: {k: energyOutlet, v: settled}
  - t: Perfect excuse to be a homebody
    s: 2
    prof: {k: energyOutlet, v: homebody}
  - t: Suspects you wet the windows on purpose, deeply aggrieved
    s: 3
    prof: {k: energyOutlet, v: needy}
  - t: Nowhere to burn energy → demolition begins
    s: 4
    prof: {k: energyOutlet, v: destructive}
