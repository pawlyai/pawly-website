BANDS:
- min: 12
  max: 20
  theme: B
  artwork: secure-soulmate
  name: The Secure Soulmate
  tagline: Emotionally steady, high-EQ, heartbreakingly well-adjusted.
  chip: Secure
  descDog: ['<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>Quiet devotion — {name} loves deeply and holds it lightly.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Calm greetings, easy independence, affection on a steady low flame. Bonded, never needy.</div>', '<div class="d-body"><span class="lbl">The real read</span>The gold standard of attachment. {name} feels safe, so they don’t have to prove it — protect it with real quality time.</div>']
  descCat: ['<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>Quiet devotion — {name}’s love runs deep and undemanding.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>A slow blink from across the room, company without clinginess, affection offered on an even keel.</div>', <div class="d-body"><span class="lbl">The real read</span>A securely attached cat is a quiet gift. Phone-free time and a steady rhythm keep the bond topped up.</div>]
  traits: [secure, high-EQ, steady, deeply bonded]
  tipDog: Protect the bond with quality time — a weekly phone-free walk or grooming session is {name}’s recharge. A set “reward signal” makes them feel chosen.
  tipCat: Protect the bond with phone-free time — even 15 min of grooming or play. A consistent “reward cue” (a special whistle) makes {name} feel favored.
- min: 21
  max: 29
  theme: A
  artwork: independent-icon
  name: The Independent Icon
  tagline: Strong boundaries, CEO energy, a soul entirely their own.
  chip: Independent
  descDog: ['<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>Love on their terms — the closeness {name} gives is chosen, not needed.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Selective affection, a clear personal bubble, a “favours are granted” air. Confident and self-contained.</div>', '<div class="d-body"><span class="lbl">The real read</span>Independence isn’t coldness. Respect the bubble, be the source of the good stuff, and {name} opts in to you.</div>']
  descCat: ['<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>Love on their terms — {name}’s a self-possessed icon.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Appears when it suits, keeps a bubble, grants attention like a favour. Smart, aloof, unbothered.</div>', <div class="d-body"><span class="lbl">The real read</span>A cat that doesn’t need you makes the closeness it does give mean more. Private territory + a puzzle feeder earn its respect.</div>]
  traits: [independent, strong boundaries, self-possessed, clever]
  tipDog: Don’t force the cuddle. Give {name} a private territory and a “job”; swap the bowl for a snuffle feeder so they get the hunt they crave.
  tipCat: Give {name} a private high or hidden territory that’s off-limits to interruption, and a puzzle feeder for the “hunt.” Let them come to you.
- min: 30
  max: 38
  theme: C
  artwork: velcro-bestie
  name: The Velcro Bestie
  tagline: Low on security, high on devotion — their whole world is you.
  chip: Velcro
  descDog: ['<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>All-in attachment — {name} has pinned their whole heart on you.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Shadowing you room to room, distress when you leave, affection turned all the way up.</div>', '<div class="d-body"><span class="lbl">The real read</span>Sweet, but it can tip into real anxiety. Build {name}’s confidence that “alone” is safe — short departures, a worn-scent shirt; if they panic or won’t eat alone, ask your vet.</div>']
  descCat: ['<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>All-in attachment — {name}’s whole world is you.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Follows you everywhere, cries when you go, melts into every lap moment.</div>', '<div class="d-body"><span class="lbl">The real read</span>Rare and intense in a cat. Change-sensitive — keep routines fixed, add perches and Feliway, and see a vet for any litter-box or urinary change (stress cystitis).</div>']
  traits: [velcro, deeply devoted, sensitive, your shadow]
  tipDog: '⚠ #1 profile for separation anxiety. Do short daily departure drills (coat on, sit 5 min, take it off); leave a worn, your-scent shirt; if {name} panics, destroys, or won’t eat alone, ask your vet — an SSRI can help alongside training.'
  tipCat: ⚠ Change-sensitive cats can develop stress cystitis (FIC — straining/blood in urine). Keep a fixed routine, add a Feliway diffuser and extra safe perches, and see a vet for any litter-box or urinary change.
- min: 39
  max: 48
  theme: D
  artwork: chaos-agent
  name: The Chaos Agent
  tagline: Surplus energy, demolition expert, household comedian.
  chip: Chaos
  descDog: ['<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>Love expressed as pure, high-octane chaos.</b></div>', '<div class="d-body"><span class="lbl">What it looks like</span>Zoomies, launched toys, the living room as a racetrack — full-send or dead-asleep, nothing in between.</div>', '<div class="d-body"><span class="lbl">The real read</span>Destruction is energy with nowhere to go. Burn brain and body: scent games, a new trick a day, hard daily exercise.</div>']
  descCat: [<div class="d-summary"><span class="label">LOVE LANGUAGE</span><b>Love expressed as 3am parkour and knocked-over cups.</b></div>, '<div class="d-body"><span class="lbl">What it looks like</span>Curtain climbs, shelf clearances, a sprint across your face at dawn. The chaos is an invitation to play.</div>', '<div class="d-body"><span class="lbl">The real read</span>Under-stimulated, not bad. Vertical space, 20 min of wand play a day, and rotating toys turn mayhem into healthy burn.</div>']
  traits: [high-energy, demolition expert, comedian, full-send]
  tipDog: 'Burn brain + body: 10 min of scent/hide games ≈ 1 hr walk; teach one new trick a day; hard exercise daily. A tired {name} is a civilized {name}.'
  tipCat: Add vertical space, 20 min of wand play a day, and rotate toys. Prey-simulation and puzzle feeders turn 3am parkour into healthy burn.
disclaimer: '<b>Just for fun</b>: a playful read of {name}’s attachment style from 12 everyday moments.<br>For entertainment and sharing only — not a substitute for professional vet advice.'
