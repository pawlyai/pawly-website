slug: WhoRunsTheHouse
id: who_runs_house
titleShort: Who Runs This House?
eraTitle: BOND CHECK
h1: Who really runs <span class="accent">{name}</span>’s house?
sub: 5 quick, fun questions about how {name} treats you at home. I’ll call where you two really stand — and save a little to {name}’s profile.
trending: ✨ NOW TRENDING
startLabel: Find out who’s boss
tipTemplate: The {n} thing{s} on file ({dims}) are already answered — these 5 are about the little power moves only you see.
calcLines: [Reading the dynamic…, Counting the power moves…, 'Who serves whom? Checking…', Calling the verdict…]
scoreBase: 0
meterEnds: {low: Your loyal shadow, high: You’re the butler}
dims: [Bond & attachment, Daily routine]
dimKeys: [attachment, routine]
DOG_QUESTIONS:
- tag: The Welcome
  q: You flop onto the sofa after a long day. {name}’s first move?
  opts:
  - t: Races over so thrilled they crash into you
    s: 1
    prof: {k: greeting, v: exuberant}
  - t: Comes over, sniffs you, settles in like they’re here to listen
    s: 3
    prof: {k: greeting, v: calm-bonded}
  - t: Sighs because you took *their* spot, stares till you move
    s: 5
    prof: {k: boundaries, v: assertive}
  - t: Drops the leash/ball on you — *quit sulking, it’s work time*
    s: 10
    prof: {k: boundaries, v: runs-the-show}
- tag: Treat Power
  q: Who really controls the treats in this house?
  opts:
  - t: You do — they sit and wait for the cue
    s: 1
    prof: {k: impulseControl, v: high}
  - t: One heartbroken look and you cave instantly
    s: 3
    prof: {k: impulseControl, v: persuasive}
  - t: They raid your bag / nose open the cupboard themselves
    s: 5
    prof: {k: impulseControl, v: resourceful}
  - t: They don’t deign to beg — they park and wait for the best piece
    s: 10
    prof: {k: impulseControl, v: entitled}
- tag: Sleeping Spot
  q: At night, where does {name} end up?
  opts:
  - t: On the floor or guarding the foot of the bed
    s: 1
    prof: {k: sleepLocation, v: separate}
  - t: Shoulder to shoulder, or using your arm as a pillow
    s: 3
    prof: {k: sleepLocation, v: with-you}
  - t: Dead center of the bed; you cling to the edge
    s: 5
    prof: {k: sleepLocation, v: bed-center}
  - t: Their own custom luxury bed — you just change the sheets
    s: 10
    prof: {k: sleepLocation, v: own-throne}
- tag: Attention
  q: 'You’re on the phone gossiping. {name} is:'
  opts:
  - t: Playing with a ball, zero reaction
    s: 1
    prof: {k: attentionSeeking, v: low}
  - t: Head tilted, like they know exactly who the villain is
    s: 3
    prof: {k: attentionSeeking, v: attuned}
  - t: Staging a huge distraction to steal your attention
    s: 5
    prof: {k: attentionSeeking, v: demanding}
  - t: Eyes saying *you’re the only one who finds this interesting*
    s: 10
    prof: {k: attentionSeeking, v: unbothered-boss}
- tag: Big Change
  q: If you moved to a brand-new city, who’d be more anxious?
  opts:
  - t: Them — you’re their whole world
    s: 1
    prof: {k: adaptability, v: you-dependent}
  - t: Both — you’d cling to each other to cope
    s: 3
    prof: {k: adaptability, v: co-regulating}
  - t: You — worrying if the light/floor/neighbors will upset them
    s: 5
    prof: {k: adaptability, v: pampered}
  - t: Them? They rule everywhere. You handle the logistics
    s: 10
    prof: {k: adaptability, v: unflappable-boss}
