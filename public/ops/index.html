<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toki · 增长运营平台</title>
<style>
:root{--brand:#FF9F43;--brand-50:#FDF7F1;--brand-100:#FAE2CA;--brand-900:#AE5500;--navy:#1B2437;--navy-2:#2A3550;--teal:#1F7C81;--teal-50:#EDF8F9;--blue:#0F70BF;--crit:#E05A49;--ink:#1B2437;--ink-2:#4A4A4A;--ink-3:#6B6B6B;--line:#E7E1D8;--bg:#F7F3EC;--green:#2E9E67;--amber:#C2871E;--purple:#6E56CF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}button,input,select,textarea{font-family:inherit}
.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff}
.top .bar{display:flex;align-items:center;gap:10px 14px;padding:10px 20px;flex-wrap:wrap}
.top .brand{font-weight:800;font-size:15px}.top .brand small{color:var(--brand);font:700 11px/1 ui-monospace,monospace;letter-spacing:.14em;margin-right:8px}
.top .sp{flex:1}.top .wk{font-size:12px;color:#C9D0DC}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 14px;background:var(--navy-2)}
.tab{padding:11px 14px 10px;font-weight:700;color:#AEB6C4;cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;font-size:13.5px;display:flex;align-items:center;gap:6px}
.tab:hover{color:#fff}.tab.on{color:#fff;border-bottom-color:var(--brand)}
.tab .n{color:var(--brand)}
.tab .cnt{font:700 10px/1 ui-monospace,monospace;background:var(--crit);color:#fff;border-radius:99px;padding:3px 6px}.tab .cnt.amber{background:var(--amber)}.tab .cnt.blue{background:var(--blue)}
.main{max-width:1280px;margin:0 auto;padding:18px 20px 80px}
.zone{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font:800 12px/1 ui-monospace,monospace;letter-spacing:.14em}
.zone:first-child{margin-top:4px}
.zone span{padding:7px 11px;border-radius:8px}
.zone.data span{background:var(--teal);color:#fff}.zone.ops span{background:var(--brand);color:#fff}
.zone i{flex:1;height:2px;border-radius:2px}.zone.data i{background:#CFE6E7}.zone.ops i{background:var(--brand-100)}
.zone em{font-style:normal;font:600 12.5px/1.4 'PingFang SC',sans-serif;letter-spacing:0;color:var(--ink-3)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px;margin:0 0 14px;box-shadow:0 4px 18px rgba(60,45,25,.05);scroll-margin-top:110px}
.card>h2{font-size:16px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.card>h2 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .desc{color:var(--ink-3);font-size:12.5px;margin:2px 0 12px}
.card.hl{animation:hl 1.6s ease}@keyframes hl{0%{box-shadow:0 0 0 4px var(--brand)}100%{box-shadow:0 4px 18px rgba(60,45,25,.05)}}
h3.sub{font-size:13.5px;font-weight:800;color:var(--navy);margin:16px 0 8px;border-left:4px solid var(--brand);padding-left:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.sub .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:980px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:4px 0}
.kpi{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-width:0}
.kpi .k{font:700 10.5px/1.3 ui-monospace,monospace;color:var(--ink-3)}
.kpi .v{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.3px;margin-top:2px}
.kpi .d{font-size:11px;color:var(--ink-3);margin-top:1px}
.kpi.red{border-color:#F3C9C1;background:#FDF1EE}.kpi.amber{border-color:#F3DFAE;background:#FFF8EC}.kpi.green{border-color:#CBEBDA;background:#F1FAF5}
.kpi.star{border-color:var(--navy);background:var(--navy)}.kpi.star .k,.kpi.star .d{color:#C9D0DC}.kpi.star .v{color:var(--brand)}
.up{color:var(--green);font-weight:700}.down{color:var(--crit);font-weight:700}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;font-size:11px;font-weight:700;white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover td{background:var(--brand-50)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.click{cursor:pointer}table.t tr.sel td{background:#FFF4E6}
table.t tr.sub td{background:#FBF9F5;font-size:12px}
table.t td.bad{color:var(--crit);font-weight:800}table.t td.good{color:var(--green);font-weight:800}
.pill{display:inline-block;font:700 10.5px/1 ui-monospace,monospace;padding:4px 7px;border-radius:99px;white-space:nowrap}
.p-green{background:#EAF7F0;color:var(--green)}.p-amber{background:#FBF3E1;color:var(--amber)}.p-red{background:#FBEDE9;color:var(--crit)}.p-gray{background:#F0EEEA;color:var(--ink-3)}.p-blue{background:#EAF3FB;color:var(--blue)}.p-navy{background:var(--navy);color:#fff}.p-purple{background:#F0ECFB;color:var(--purple)}.p-brand{background:var(--brand-100);color:var(--brand-900)}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:6px 11px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.btn:hover{border-color:var(--brand)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:7px}.btn.danger{color:var(--crit)}
.muted{color:var(--ink-3)}.small{font-size:12px}.mono{font-family:ui-monospace,monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{background:var(--teal-50);border:1px solid #D5ECED;border-radius:12px;padding:10px 13px;font-size:12.5px;color:var(--ink-2);margin:10px 0}
.note.warn{background:#FFF8EC;border-color:#FBE9C0}.note.red{background:#FDF1EE;border-color:#F3C9C1}.note.brand{background:var(--brand-50);border-color:var(--brand-100)}
.note b{color:var(--navy)}
.empty{padding:16px;text-align:center;color:var(--ink-3);font-size:12.5px;border:1px dashed var(--line);border-radius:10px;background:#FDFCFA}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.f .full{grid-column:1/-1}
.f label,.lbl{font-size:11.5px;font-weight:700;color:var(--ink-3);display:block;margin-bottom:3px}
.f input,.f select,.f textarea,.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;background:#fff;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brand-100);border-color:var(--brand)}
select.flt{border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;background:#fff;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-3)}
.seg button.on{background:var(--navy);color:#fff}
.tog{position:relative;width:36px;height:20px;border-radius:99px;background:#D9D3C8;border:none;cursor:pointer;flex:0 0 auto}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}.tog.on::after{left:18px}.tog.lock{background:#E9C2BB;cursor:not-allowed}
.pbar{height:8px;background:#F3EFE8;border-radius:99px;overflow:hidden;min-width:60px}.pbar>div{height:100%;background:var(--teal);border-radius:99px}
.hbar{display:grid;grid-template-columns:170px 1fr 120px;gap:10px;align-items:center;margin:5px 0;font-size:12.5px}
.hbar .track{background:#F3EFE8;border-radius:6px;height:16px;overflow:hidden}.hbar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#1F7C81,#5FB3B7)}
.hbar .fill.red{background:linear-gradient(90deg,#E05A49,#EE8B7E)}.hbar .fill.b{background:linear-gradient(90deg,#FF9F43,#FFBE7D)}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
@media(max-width:640px){.hbar{grid-template-columns:100px 1fr 80px}.f{grid-template-columns:1fr}}
.al{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;font-size:13px;background:#FDFCFA}
.al.red{background:#FDF1EE;border-color:#F3C9C1}.al.amber{background:#FFF8EC;border-color:#F3DFAE}
.al .tx{flex:1;min-width:0}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.pcol{background:#FBF9F5;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:110px;min-width:0}
.pcol h4{font-size:12px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;margin:2px 2px 8px}
.pcol h4 .c{font:700 10px/1 ui-monospace,monospace;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 7px;color:var(--ink-3)}
.rq{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin-bottom:8px;font-size:12px}
.rq .t{font-weight:800;color:var(--navy);font-size:12.5px;line-height:1.35}
.rq .m{color:var(--ink-3);font-size:11px;margin:3px 0 5px;word-break:break-all}
.rq .acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.prog{height:6px;background:#F3EFE8;border-radius:99px;overflow:hidden;margin:6px 0 2px}.prog>div{height:100%;background:linear-gradient(90deg,var(--purple),#A08BF0);animation:pr 2.6s linear forwards}
@keyframes pr{from{width:5%}to{width:100%}}
.kit{border:1px dashed var(--teal);border-radius:10px;padding:8px 10px;background:#fff;font-size:11.5px}
.kit div{display:flex;gap:6px;align-items:center;margin:3px 0}.kit b{min-width:74px;color:var(--teal)}
.kit .u{font-family:ui-monospace,monospace;word-break:break-all;color:var(--ink-2);flex:1}
.cp{border:none;background:none;cursor:pointer;color:var(--ink-3);font-size:12px}
/* modal / drawer */
.mbg{position:fixed;inset:0;background:rgba(27,36,55,.5);display:flex;align-items:flex-start;justify-content:center;z-index:60;padding:30px 16px;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:1040px;width:100%;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.narrow{max-width:620px}
.modal>h3{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.modal>h3 .x{margin-left:auto}
.rv{display:grid;grid-template-columns:380px 1fr;gap:18px}@media(max-width:860px){.rv{grid-template-columns:1fr}}
.phone{width:360px;max-width:100%;height:680px;border:10px solid #1B2437;border-radius:34px;overflow:hidden;background:#fff;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.phone iframe{width:100%;height:100%;border:none;display:block}
.hist{font-size:11.5px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:10px;margin-top:6px}.hist div{margin:3px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}
/* misc */
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}.cal div{height:18px;border-radius:4px;background:#F0EEEA;font:700 9px/18px ui-monospace,monospace;text-align:center;color:#fff}
.cal .a{background:#9CCFD1}.cal .t1{background:var(--teal)}.cal .t2{background:#145558}.cal .f{background:transparent;border:1px dashed var(--line)}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.lv div{border-radius:10px;padding:9px 10px;border:1px solid var(--line);background:#fff;font-size:11.5px;color:var(--ink-2)}
.lv b{display:block;font-size:18px;color:var(--navy)}.lv i{font-style:normal;font:700 10px/1 ui-monospace,monospace;color:var(--purple)}
.seglist{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.segk{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:12px}
.segk b{display:block;color:var(--navy);font-size:12.5px;margin-bottom:3px}
.segk.ok{border-color:#CBEBDA;background:#F1FAF5}.segk.bad{border-color:#F3C9C1;background:#FDF1EE}.segk.run{border-color:var(--purple);background:#F7F5FE}
.cad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:900px){.cad{grid-template-columns:1fr 1fr}}
.cad div{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--ink-2)}.cad b{display:block;color:var(--navy);font-size:12.5px;margin-bottom:3px}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
ul.clean{padding-left:18px}ul.clean li{font-size:12.5px;color:var(--ink-2);margin:4px 0}
.spark{display:block}
.exp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.exp .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exp .hd b{color:var(--navy)}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.cmp div{background:#FBF9F5;border-radius:9px;padding:7px 9px;font-size:11.5px;color:var(--ink-3)}.cmp b{display:block;font-size:16px;color:var(--navy)}

/* LLM 接入点标注 */
.tagc{font:700 10.5px/1 ui-monospace,monospace;background:rgba(255,159,67,.18);color:var(--brand);padding:5px 8px;border-radius:99px}
.insbody .note{margin:0 0 6px}
</style>
</head>
<body>
<div class="top"><div class="bar"><div class="brand"><small>TOKI · GROWTH OPS</small>增长运营平台</div><span class="tagc">数据看板 + 工单生成</span><span class="sp"></span><select id="wkSel" class="btn ghost sm" style="display:none" aria-label="数据周"></select></div><div class="tabs" id="tabs"></div></div>
<div class="main" id="main"><div style="max-width:640px;margin:60px auto;background:#fff;border:1px solid #E7E1D8;border-radius:16px;padding:22px 24px;line-height:1.7"><b style="font-size:16px">页面没加载出来?</b><br>看到这段字,说明网页脚本没有运行。请用 Chrome 或 Safari 打开,并确认浏览器允许 JavaScript。</div></div>
<script>
(function () {
'use strict';
/* ================= 基础工具 ================= */
const LS_TAB = 'tkg:v15:tab', LS_TOKEN = 'tkg:ops:token';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const ssDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
// 页面里任何来自接口 / LLM 的文本都先过一遍:邮箱、手机号一律打码(后端已脱敏,这里是第二道)。
const scrub = s => String(s == null ? '' : s).replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '***').replace(/\+\d[\d\s-]{7,}\d/g, '***');
const esc = s => scrub(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const nowStr = () => { const d = new Date(); return ymd(d).slice(5) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const PEND = '待接入';
const fmt = (v, k) => {
  if (v == null || (typeof v === 'number' && !isFinite(v))) return '—';
  if (k === 'pct') return (+v).toFixed(1) + '%';
  return (+v).toLocaleString('en-US', { maximumFractionDigits: 1 });
};
const pill = (t, c) => '<span class="pill ' + (c || 'p-gray') + '">' + esc(t) + '</span>';
const kpi = (k, v, d, cls) => '<div class="kpi ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (d ? '<div class="d">' + d + '</div>' : '') + '</div>';
const zone = (kind, title, em) => '<div class="zone ' + kind + '"><span>' + (kind === 'data' ? 'DATA · ' : 'OPS · ') + title + '</span>' + (em ? '<em>' + em + '</em>' : '') + '<i></i></div>';
const card = (id, title, desc, right, body, cls) => '<div class="card ' + (cls || '') + '"' + (id ? ' id="' + id + '"' : '') + '><h2>' + title + (right ? '<span class="r">' + right + '</span>' : '') + '</h2>' + (desc ? '<div class="desc">' + desc + '</div>' : '') + body + '</div>';
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600); }
function copy(v) {
  const ok = () => toast('已复制:' + (v.length > 70 ? v.slice(0, 70) + '…' : v));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(v).then(ok, fb); else fb();
  function fb() { const ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('复制失败'); } ta.remove(); }
}
const slugify = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 32);
const yyyymm = (() => { const d = new Date(); return String(d.getFullYear()) + pad(d.getMonth() + 1); })();

/* ================= 字典 ================= */
const SRC = { TikTok: 'tiktok', Instagram: 'instagram', Reddit: 'reddit', Facebook: 'facebook', '小红书': 'xiaohongshu', YouTube: 'youtube', 'App 内': 'inapp', Push: 'push' };
const TYPES = {
  acquire: [{ v: 'quiz', l: '测验落地页' }, { v: 'tool', l: '小工具落地页' }, { v: 'landing', l: '活动落地页' }, { v: 'script', l: '短视频脚本 + 落地页' }],
  activate: [{ v: 'onb_content', l: 'Onboarding 测试内容' }, { v: 'onb_copy', l: '引导文案 / 开屏一件事' }, { v: 'memory', l: 'Memory 规则优化' }],
  retain: [{ v: 'pro_copy', l: 'Proactive 文案' }, { v: 'activity', l: '活动页面' }],
  refer: [{ v: 'share', l: '分享卡' }],
  monetize: [{ v: 'paywall', l: '付费页文案' }, { v: 'dyn', l: '动态入口文案' }]
};
const typeLabel = v => { for (const k in TYPES) { const t = TYPES[k].find(x => x.v === v); if (t) return t.l; } return v; };
const INAPP = ['onb_content', 'onb_copy', 'memory', 'pro_copy', 'activity', 'paywall', 'dyn'];
const PICS = ['wanxin', 'christina', 'julien', 'han', 'yuting', 'xiaohui'];

/* 埋点指标:接口里的名字 → 页面上的中文名 */
const METRIC_LABEL = {
  account_created: '新账号', consent_given: '同意条款', pet_profile_completed: '宠物建档完成', chat_first_message: '首次聊天',
  assessment_delivered: '评估送达', checkin_completed: '打卡完成', trial_started: '开启试用', subscription_activated: '订阅生效',

let AUTH_ERR = '';
async function api(path) {

  let j = null; try { j = await r.json(); } catch (e) {}

}

// ISO 周标签(给定周一的 YYYY-MM-DD)
function isoLabel(mon) {
  const d = new Date(mon + 'T00:00:00Z'); const th = new Date(d); th.setUTCDate(d.getUTCDate() + 3);
  const y = th.getUTCFullYear(), j1 = new Date(Date.UTC(y, 0, 4)), wk = 1 + Math.round(((th - j1) / 86400000 - 3 + ((j1.getUTCDay() + 6) % 7)) / 7);
  return y + '-W' + pad(wk);
}
function buildWeeks(period) {
  const mon = period.start.slice(0, 10), out = [];
  for (let i = 0; i < 8; i++) { const d = new Date(mon + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - 7 * i); const s = d.toISOString().slice(0, 10); out.push({ label: isoLabel(s), mon: s }); }
  return out;   // 最新在前
}
async function loadWeek(label) {
  D.loading = true; D.err = ''; render();
  try {
    const q = label ? '?week=' + encodeURIComponent(label) : '';
    D.agg = await api('/aggregate' + q);
    if (!D.weeks.length) { D.weeks = buildWeeks(D.agg.period); D.wi = 0; }
    const prevLabel = isoLabel(new Date(Date.parse(D.agg.period.start.slice(0, 10) + 'T00:00:00Z') - 7 * 86400000).toISOString().slice(0, 10));
    D.prev = await api('/aggregate?week=' + prevLabel).catch(() => null);
  } catch (e) { D.err = e.auth ? '' : e.message; D.agg = null; D.prev = null; }
  D.loading = false; render();
}
const todaySGT = () => sgtDate(new Date());
async function loadInsight(m) {

    } else {
      const h = await api('/insights/history?module=' + m + '&from=' + s.date + '&to=' + s.date);

}

function deltaTxt(cur, prev) {
  if (prev == null) return '';

  const t = prev ? Math.abs(d / prev * 100).toFixed(0) + '%' : Math.abs(d);
  return '<span class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲' : '▼') + ' ' + t + '</span> <span class="muted">vs 上周</span>';
}

    '<textarea id="tkOut-' + tab + '" data-tkout="' + tab + '" spellcheck="false" style="width:100%;min-height:520px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.6 ui-monospace,Menlo,monospace;background:#FDFCFA;resize:vertical">' + esc(s.out) + '</textarea>' +
    '<div class="lbl" style="margin-top:6px">最后一行 · 标签(优先级 / label / 发版)</div><div id="tkTags-' + tab + '" class="mono" style="background:var(--teal-50);border:1px solid #D5ECED;border-radius:10px;padding:7px 10px;font-size:12px;color:var(--teal);word-break:break-all">' + esc(tkTags(tab, d).join(' ')) + '</div>' +
    '<div class="small muted" style="margin-top:4px">' + (s.edited ? '你改过描述,表单再改不会覆盖;点「按表单重新生成」可还原。' : '描述随左边表单实时更新,也可以直接在这里改。') + '</div>' +
    '<div class="row" style="margin-top:8px"><button class="btn pri" data-tka="copyMsg" data-tab="' + tab + '">📋 复制整条 bot 消息</button><button class="btn" data-tka="copyBody" data-tab="' + tab + '">只复制描述</button>' + (s.edited ? '<button class="btn" data-tka="regen" data-tab="' + tab + '">按表单重新生成</button>' : '') + '<button class="btn" data-tka="save" data-tab="' + tab + '">保存到记录</button><button class="btn sm" data-tka="clear" data-tab="' + tab + '">清空</button></div>';
  const rec = TKH.filter(x => x.tab === tab);
  const recs = rec.length ? '<div class="tw"><table class="t"><thead><tr><th>时间</th><th>工单标题</th><th>产出</th><th>工单号(bot 回的 PAW-xxx)</th><th>状态</th><th></th></tr></thead><tbody>' +
    rec.map(x => '<tr' + (x.id === s.cur ? ' class="sel"' : '') + '><td class="n small">' + esc(x.ts) + '</td><td><b>' + esc(x.title) + '</b></td><td class="small">' + esc(x.typeLabel) + '</td><td><input class="inp" data-tkh="paw" data-id="' + x.id + '" value="' + esc(x.paw || '') + '" placeholder="PAW-131" style="max-width:120px">' + (x.paw ? '<div class="row" style="gap:4px;margin-top:4px">' + [['status', '/status'], ['reply', '/reply 补链接'], ['done', '/done'], ['cancel', '/cancel']].map(c => '<button class="btn sm" data-tka="cmdH" data-c="' + c[0] + '" data-tab="' + tab + '" data-id="' + x.id + '">' + c[1] + '</button>').join('') + '</div>' : '') + '</td><td><select class="flt" data-tkh="st" data-id="' + x.id + '">' + ['草稿', '已建单', '生产中', '待 review', '已发布'].map(v => '<option' + (v === x.st ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></td><td class="n"><button class="btn sm" data-tka="load" data-tab="' + tab + '" data-id="' + x.id + '">载入</button> <button class="btn sm" data-tka="dup" data-tab="' + tab + '" data-id="' + x.id + '">复制一份改</button> <button class="btn sm" data-tka="copyH" data-tab="' + tab + '" data-id="' + x.id + '">复制消息</button> <button class="btn sm danger" data-tka="delH" data-tab="' + tab + '" data-id="' + x.id + '">删除</button></td></tr>').join('') + '</tbody></table></div>'
    : '<div class="empty">这个环节还没有工单记录。生成后点「保存到记录」,之后可以载入、复制一份改,或填回 bot 给的工单号,一键复制 /status、/reply、/done 等后续命令。</div>';
  return card('tk-' + tab, '🎫 生成 Multica 工单(发给 Tokitail triage bot)', '填表 → 右边按规则模板生成一整条 bot 消息(不调用 LLM):第一行「命令 + 标题」,换行后是描述(交付规格、合规、追踪链接、验收标准),最后一行是优先级 / label / 发版标签 → 描述可以直接改 → 复制发到群里建单。上面数据里的问题可以一键填进这张表。<br><b>团队共享:后续单独开单上线</b>(目前工单只保存在你这台浏览器里)。', '',
    '<div class="rv" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div>' + form + '</div><div>' + out + '</div></div><h3 class="sub">本环节工单记录</h3>' + recs + TK_HELP);
}
const TK_HELP = '<details style="margin-top:10px"><summary class="small" style="cursor:pointer;font-weight:700">📖 bot 命令速查</summary><div class="tw" style="margin-top:6px"><table class="t"><tbody>' +
  [['/fix /feature /ui /ask /triage', '开单:第一行是「命令 + 标题」,换行后是描述'], ['#urgent #high #medium #low', '优先级(或 #p0..#p3);其余 #tag 变 label'], ['#release=1.2.1 / #norelease / #nodeploy', '指定发版本 / 验过合了但不出包 / 验过合了但不动服务器'], ['/reply PAW-131 <内容>', 'agent 反问时补充信息(直接回复它那条消息也行);同义 /r /comment'], ['/status [PAW-131]', '看跟踪中的工单、在跑的部署和发版'], ['/done PAW-131 · /cancel PAW-131', '关单 · 关单并标成不修'], ['/assign PAW-131 [agent]', '分错了改派'], ['/untrack PAW-131', '不再往群里报,工单还开着'], ['/deploy · /release [1.2.1]', '手动部署当前 main · 手动出包']]
    .map(r => '<tr><td class="mono small" style="white-space:nowrap">' + esc(r[0]) + '</td><td class="small">' + esc(r[1]) + '</td></tr>').join('') + '</tbody></table></div><div class="small muted" style="margin-top:4px">/fix 和 /feature 走完整流水线:开 PR → App QA 逐条验收 → 合进 main → 后端自动重建服务 / iOS 自动出 TestFlight(不提审)。图片 / 文件带 caption 发,会挂成附件。</div></details>';
function tkRefresh(tab) {
  const s = tkS(tab); saveTKD();
  const t = document.getElementById('tkTtl-' + tab); if (t) t.textContent = tkCmdLine(s.d);
  const g = document.getElementById('tkTags-' + tab); if (g) g.textContent = tkTags(tab, s.d).join(' ');
  if (!s.edited) { s.out = s.view === 'md' ? tkMd(tab, s.d) : tkJson(tab, s.d); const o = document.getElementById('tkOut-' + tab); if (o) o.value = s.out; }
}
function tkPrefill(tab, patch) {
  const s = tkS(tab); s.d = Object.assign(tkBlank(tab), patch); if (patch.type && !patch.platforms) s.d.platforms = tkDefPlats(patch.type);
  if (!patch.cmd) s.d.cmd = TK_CMD_DEF[s.d.type] || '/feature'; if (patch.rel === undefined) s.d.rel = tkRelDef(s.d.type);
  s.edited = false; s.cur = null; saveTKD(); go(tab, 'tk-' + tab); toast('已根据数据填好工单,确认后复制整条消息发给 bot');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tka]'); if (!el) return;
  const a = el.dataset.tka, tab = el.dataset.tab, s = tkS(tab), id = el.dataset.id, x = id ? TKH.find(h => h.id === id) : null;
  const body = () => { const o = document.getElementById('tkOut-' + tab); return o ? o.value : s.out; };
  if (a === 'plat') { const v = el.dataset.v, i = s.d.platforms.indexOf(v); if (i >= 0) s.d.platforms.splice(i, 1); else s.d.platforms.push(v); saveTKD(); render(); }
  if (a === 'view') { if (s.edited && !confirm('切换会丢掉你在正文里的手动修改,继续?')) return; s.view = el.dataset.v; s.edited = false; render(); }
  if (a === 'copyTitle') copy(tkCmdLine(s.d));
  if (a === 'copyMsg') copy(tkMsg(tab, s.d, body()), '整条 bot 消息');
  if (a === 'copyBody') copy(body());
  if (a === 'regen') { s.edited = false; render(); }
  if (a === 'clear') { if (!confirm('清空这张工单表?')) return; s.d = tkBlank(tab); s.edited = false; s.cur = null; saveTKD(); render(); }
  if (a === 'save') {
    const m = tkMissing(s.d); if (m.length && !confirm('还没填:' + m.join('、') + '。仍然保存?')) return;
    const ex = s.cur && TKH.find(h => h.id === s.cur);
    const rec = { id: ex ? ex.id : 'tk' + Date.now().toString(36), tab, ts: nowStr(), title: tkTitle(s.d), typeLabel: tkType(tab, s.d), d: JSON.parse(JSON.stringify(s.d)), body: body(), msg: tkMsg(tab, s.d, body()), view: s.view, paw: ex ? ex.paw : '', st: ex ? ex.st : '草稿' };
    if (ex) TKH[TKH.indexOf(ex)] = rec; else TKH.unshift(rec);
    s.cur = rec.id; saveTKH(); render(); toast(ex ? '已更新这条记录' : '已保存到记录');
  }
  if (a === 'load' && x) { const t = tkS(x.tab); t.d = JSON.parse(JSON.stringify(x.d)); t.view = x.view || 'md'; t.out = x.body; t.edited = true; t.cur = x.id; saveTKD(); if (el.dataset.jump) go(x.tab, 'tk-' + x.tab); else { render(); const c = document.getElementById('tk-' + tab); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); } toast('已载入(正文是当时保存的版本)'); }
  if (a === 'dup' && x) { s.d = JSON.parse(JSON.stringify(x.d)); s.d.topic += '(副本)'; s.edited = false; s.cur = null; saveTKD(); render(); toast('已复制一份到表单,改完再保存'); }
  if (a === 'copyH' && x) copy(x.msg || (x.title + '\n\n' + x.body), '整条 bot 消息');
  if (a === 'cmdH' && x && x.paw) {
    const c = el.dataset.c, P = x.paw.trim();
    const kit = tkKit(x.d).map(k => k.p + ':' + k.url.replace('{工单号}', P)).join('\n');
    copy(c === 'status' ? '/status ' + P : c === 'done' ? '/done ' + P : c === 'cancel' ? '/cancel ' + P : '/reply ' + P + ' 追踪链接(已填工单号):\n' + (kit || '(这类工单没有追踪链接)'), '/' + c + ' ' + P);
  }
  if (a === 'delH' && x) { if (!confirm('删除这条记录?')) return; TKH = TKH.filter(h => h !== x); if (s.cur === id) s.cur = null; saveTKH(); render(); }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.getAttribute('data-tk'), ot = t.getAttribute('data-tkout');
  if (ot) { const s = tkS(ot); s.out = t.value; if (!s.edited) { s.edited = true; const y = window.scrollY, pos = t.selectionStart; render(); window.scrollTo(0, y); const o = document.getElementById('tkOut-' + ot); o.value = s.out; o.focus(); try { o.setSelectionRange(pos, pos); } catch (er) {} } return; }
  if (k && t.tagName !== 'SELECT') { const [tab, f] = k.split('.'); tkS(tab).d[f] = t.value; tkRefresh(tab); }
});
document.addEventListener('change', e => {
  const t = e.target, k = t.getAttribute('data-tk'), hk = t.getAttribute('data-tkh');
  if (k && t.tagName === 'SELECT') { const [tab, f] = k.split('.'), s = tkS(tab); s.d[f] = t.value; if (f === 'type') { s.d.platforms = tkDefPlats(t.value); s.d.cmd = TK_CMD_DEF[t.value] || '/feature'; s.d.rel = tkRelDef(t.value); } saveTKD(); render(); }
  if (hk) { const x = TKH.find(h => h.id === t.dataset.id); if (x) { x[hk] = hk === 'paw' ? t.value.trim().toUpperCase() : t.value; saveTKH(); if (hk === 'paw') render(); toast('已更新'); } }
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'tokForm') return;
  e.preventDefault();
  const v = document.getElementById('tokIn').value.trim(); if (!v) return;
  ssSet(LS_TOKEN, v); AUTH_ERR = ''; D.weeks = []; Object.keys(INS).forEach(k => delete INS[k]); loadWeek();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'wkSel') { D.wi = +t.value; loadWeek(D.weeks[D.wi].label); return; }
  const dm = t.getAttribute('data-insdate');
  if (dm && t.value) { const m = +dm; INS[m] = { date: t.value, loading: true }; paintInsight(m); loadInsight(m); }
});

(async function boot() {
  if (!ssGet(LS_TOKEN)) { render(); return; }
  await loadWeek();
})();
})();
</script>
</body>
</html>
